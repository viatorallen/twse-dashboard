<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>台股看板</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d0f0e;
  --surface: #141614;
  --surface2: #1a1d1a;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.13);
  --text: #e8ebe6;
  --muted: #5a5f59;
  --muted2: #3a3f39;
  --up: #f87171;
  --up-dim: rgba(248,113,113,0.08);
  --dn: #4ade80;
  --dn-dim: rgba(74,222,128,0.08);
  --accent: #a8c5a0;
  --mono: 'DM Mono', monospace;
  --sans: 'Noto Sans TC', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 14px; }
body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding: 2.5rem 3rem;
  -webkit-font-smoothing: antialiased;
}

/* ── Header ── */
.header {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  margin-bottom: 2.5rem;
  padding-bottom: 1.5rem;
  border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: baseline; gap: 14px; }
.brand-title {
  font-family: var(--mono);
  font-size: 1.1rem;
  font-weight: 400;
  letter-spacing: 0.12em;
  color: var(--accent);
}
.brand-sub {
  font-size: 0.75rem;
  color: var(--muted);
  letter-spacing: 0.05em;
}
.header-right { display: flex; align-items: center; gap: 1.5rem; }
.clock {
  font-family: var(--mono);
  font-size: 1.4rem;
  font-weight: 300;
  color: var(--text);
  letter-spacing: 0.05em;
}
.status-pill {
  display: flex; align-items: center; gap: 7px;
  font-size: 0.72rem;
  font-family: var(--mono);
  letter-spacing: 0.08em;
  color: var(--muted);
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 100px;
  padding: 5px 14px;
}
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted2); }
.dot.live { background: var(--up); box-shadow: 0 0 8px var(--up); animation: pulse 2s infinite; }
.dot.loading { background: #fbbf24; animation: blink .8s infinite; }
.dot.error { background: var(--dn); }
.dot.closed { background: var(--muted); }
@keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.3;} }
@keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0;} }

/* ── Grid ── */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 1px;
  background: var(--border);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  margin-bottom: 1.5rem;
}
.card {
  background: var(--surface);
  padding: 1.4rem 1.6rem;
  position: relative;
  cursor: default;
  transition: background .15s;
}
.card:hover { background: var(--surface2); }
.card.fu { animation: fu .8s ease-out; }
.card.fd { animation: fd .8s ease-out; }
@keyframes fu { 0%{ background: rgba(248,113,113,.12); } 100%{ background: var(--surface); } }
@keyframes fd { 0%{ background: rgba(74,222,128,.12); } 100%{ background: var(--surface); } }

.card-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: .9rem; }
.card-code {
  font-family: var(--mono);
  font-size: .72rem;
  font-weight: 500;
  letter-spacing: .12em;
  color: var(--muted);
}
.card-name {
  font-size: .85rem;
  font-weight: 400;
  color: var(--text);
  margin-top: 3px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 140px;
}
.rm {
  background: transparent;
  border: none;
  color: var(--muted2);
  font-size: .8rem;
  cursor: pointer;
  padding: 2px 4px;
  border-radius: 4px;
  line-height: 1;
  transition: color .15s;
  flex-shrink: 0;
}
.rm:hover { color: var(--dn); }

.price-row { margin-bottom: .5rem; }
.price {
  font-family: var(--mono);
  font-size: 1.9rem;
  font-weight: 300;
  color: var(--text);
  letter-spacing: -.01em;
  line-height: 1;
}
.price.sk {
  display: inline-block;
  width: 100px; height: 2rem;
  background: var(--surface2);
  border-radius: 4px;
  animation: sh 1.4s infinite;
}
@keyframes sh { 0%,100%{opacity:.4;} 50%{opacity:.8;} }

.change {
  font-family: var(--mono);
  font-size: .78rem;
  letter-spacing: .03em;
}
.up { color: var(--up); }
.dn { color: var(--dn); }
.neu { color: var(--muted); }

.meta {
  margin-top: .75rem;
  padding-top: .75rem;
  border-top: 1px solid var(--border);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 4px;
}
.meta-item { text-align: center; }
.meta-label { font-size: .6rem; color: var(--muted); letter-spacing: .06em; margin-bottom: 2px; }
.meta-val { font-family: var(--mono); font-size: .72rem; color: var(--text); }

/* ── Sparkline ── */
.sparkline-wrap { margin-top: .55rem; }
.sparkline { width: 100%; height: 44px; display: block; overflow: visible; }
.day-range {
  margin-top: 5px;
  height: 2px;
  background: var(--muted2);
  border-radius: 2px;
  position: relative;
}
.day-range-dot {
  position: absolute;
  width: 7px; height: 7px;
  border-radius: 50%;
  top: -2.5px;
  transform: translateX(-50%);
  transition: left .6s ease, background .3s;
  border: 1.5px solid var(--surface);
}

/* ── Toolbar ── */
.toolbar {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.toolbar-section {
  display: flex; align-items: center; gap: 8px;
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 8px;
  padding: 7px 14px;
}
.t-label { font-size: .72rem; color: var(--muted); letter-spacing: .05em; }
.t-input {
  font-family: var(--mono);
  font-size: .8rem;
  background: transparent;
  border: none;
  color: var(--text);
  outline: none;
  width: 80px;
  text-transform: uppercase;
}
.t-input::placeholder { color: var(--muted2); }
.t-select {
  font-family: var(--mono);
  font-size: .78rem;
  background: transparent;
  border: none;
  color: var(--text);
  outline: none;
  cursor: pointer;
}
.t-select option { background: #1a1d1a; }
.t-btn {
  font-family: var(--mono);
  font-size: .75rem;
  letter-spacing: .06em;
  background: transparent;
  border: 1px solid var(--border2);
  color: var(--accent);
  padding: 5px 14px;
  border-radius: 6px;
  cursor: pointer;
  transition: all .15s;
}
.t-btn:hover { background: rgba(168,197,160,.08); border-color: var(--accent); }
.t-divider { width: 1px; height: 16px; background: var(--border2); }
.lu {
  margin-left: auto;
  font-family: var(--mono);
  font-size: .68rem;
  color: var(--muted);
  letter-spacing: .05em;
}

/* ── Footer ── */
.footer {
  margin-top: 1.5rem;
  padding-top: 1rem;
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
}
.footer-note {
  font-size: .68rem;
  color: var(--muted);
  letter-spacing: .03em;
  line-height: 1.8;
}
.mode-badge {
  font-family: var(--mono);
  font-size: .65rem;
  letter-spacing: .08em;
  color: var(--muted);
  border: 1px solid var(--border2);
  border-radius: 4px;
  padding: 3px 10px;
}
</style>
</head>
<body>

<div class="header">
  <div class="brand">
    <span class="brand-title">台股看板</span>
    <span class="brand-sub">SAFARI 直連版</span>
  </div>
  <div class="header-right">
    <div class="clock" id="clock">--:--:--</div>
    <div class="status-pill">
      <div class="dot loading" id="dot"></div>
      <span id="stxt">連線中</span>
    </div>
  </div>
</div>

<div class="grid" id="grid"></div>

<div class="toolbar">
  <div class="toolbar-section">
    <span class="t-label">新增</span>
    <input class="t-input" id="ti" placeholder="2454" maxlength="8" />
    <div class="t-divider"></div>
    <button class="t-btn" onclick="addTicker()">+ 新增</button>
  </div>
  <div class="toolbar-section">
    <span class="t-label">更新間隔</span>
    <select class="t-select" id="isel" onchange="changeInterval()">
      <option value="10000">10 秒</option>
      <option value="15000" selected>15 秒</option>
      <option value="30000">30 秒</option>
      <option value="60000">1 分鐘</option>
    </select>
  </div>
  <span class="lu" id="lu"></span>
</div>

<div class="footer">
  <div class="footer-note">
    資料來源：台灣證券交易所官方 Open API &nbsp;／&nbsp; 盤中（09:00–13:30）即時報價，盤後顯示當日收盤資料<br>
    上市股票輸入4位數代號，ETF 如 0050、00878
  </div>
  <span class="mode-badge" id="modeBadge">—</span>
</div>

<script>
var MIS     = 'https://mis.twse.com.tw/stock/api/getStockInfo.jsp';
var OPENAPI = 'https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL';
var tickers = ['2330','2454','2317','0050','00878','2882','3008'];
var prevPrices = {};
var priceHistory = {};   // { sym: [price, ...] }  最多保留 300 筆
var MAX_HIST = 300;
var closeCache = null;
var timer = null;

// Clock
function tickClock() {
  document.getElementById('clock').textContent = new Date().toLocaleTimeString('zh-TW', {hour12: false});
}
setInterval(tickClock, 1000); tickClock();

function isTradingHours() {
  var now = new Date();
  var day = now.getDay();
  var mins = now.getHours() * 60 + now.getMinutes();
  return day >= 1 && day <= 5 && mins >= 540 && mins < 810;
}
function setStatus(state, txt) {
  document.getElementById('dot').className = 'dot ' + state;
  document.getElementById('stxt').textContent = txt;
}

function renderCards() {
  var g = document.getElementById('grid');
  g.innerHTML = '';
  tickers.forEach(function(sym) {
    var d = document.createElement('div');
    d.className = 'card'; d.id = 'c-' + sym;
    d.innerHTML =
      '<div class="card-top">' +
        '<div>' +
          '<div class="card-code">' + sym + '</div>' +
          '<div class="card-name" id="n-' + sym + '">—</div>' +
        '</div>' +
        '<button class="rm" onclick="removeTicker(\'' + sym + '\')">✕</button>' +
      '</div>' +
      '<div class="price-row"><div class="price sk" id="p-' + sym + '"></div></div>' +
      '<div class="change neu" id="ch-' + sym + '">載入中...</div>' +
      '<div class="sparkline-wrap">' +
        '<svg class="sparkline" id="spark-' + sym + '" viewBox="0 0 100 44" preserveAspectRatio="none"></svg>' +
        '<div class="day-range"><div class="day-range-dot" id="dr-' + sym + '" style="left:50%;background:var(--muted2)"></div></div>' +
      '</div>' +
      '<div class="meta">' +
        '<div class="meta-item"><div class="meta-label">開盤</div><div class="meta-val" id="mo-' + sym + '">—</div></div>' +
        '<div class="meta-item"><div class="meta-label">最高</div><div class="meta-val" id="mh-' + sym + '">—</div></div>' +
        '<div class="meta-item"><div class="meta-label">最低</div><div class="meta-val" id="ml-' + sym + '">—</div></div>' +
      '</div>';
    g.appendChild(d);
  });
}

/* ── 歷史 & Sparkline ── */
function addHistory(sym, price) {
  if (!priceHistory[sym]) priceHistory[sym] = [];
  priceHistory[sym].push(price);
  if (priceHistory[sym].length > MAX_HIST) priceHistory[sym].shift();
}

function drawSparkline(sym, change) {
  var svgEl = document.getElementById('spark-' + sym);
  if (!svgEl) return;
  var pts = priceHistory[sym] || [];
  if (pts.length < 2) { svgEl.innerHTML = ''; return; }

  var W = 100, H = 44, PAD = 5;
  var mn = Math.min.apply(null, pts);
  var mx = Math.max.apply(null, pts);
  var rng = (mx - mn) || (mn * 0.001) || 1;
  var n   = pts.length;

  var coords = pts.map(function(p, i) {
    return [
      (i / (n - 1)) * W,
      H - PAD - ((p - mn) / rng) * (H - PAD * 2)
    ];
  });

  // 平滑三次貝茲曲線
  var d = 'M' + coords[0][0].toFixed(2) + ',' + coords[0][1].toFixed(2);
  for (var i = 1; i < coords.length; i++) {
    var cx = ((coords[i-1][0] + coords[i][0]) / 2).toFixed(2);
    d += 'C' + cx + ',' + coords[i-1][1].toFixed(2) +
         ' ' + cx + ',' + coords[i][1].toFixed(2) +
         ' ' + coords[i][0].toFixed(2) + ',' + coords[i][1].toFixed(2);
  }

  var col = change > 0 ? '#f87171' : change < 0 ? '#4ade80' : '#5a5f59';
  var gid = 'g' + sym;
  var areaD = d + 'L' + W + ',' + H + 'L0,' + H + 'Z';

  svgEl.innerHTML =
    '<defs><linearGradient id="' + gid + '" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0%" stop-color="' + col + '" stop-opacity="0.18"/>' +
      '<stop offset="100%" stop-color="' + col + '" stop-opacity="0"/>' +
    '</linearGradient></defs>' +
    '<path d="' + areaD + '" fill="url(#' + gid + ')"/>' +
    '<path d="' + d + '" fill="none" stroke="' + col +
      '" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>';
}

function updateDayRange(sym, price, low, high, change) {
  var dotEl = document.getElementById('dr-' + sym);
  if (!dotEl) return;
  var lo = parseFloat(low), hi = parseFloat(high);
  if (!lo || !hi || hi <= lo) return;
  var pct = Math.min(100, Math.max(0, (price - lo) / (hi - lo) * 100));
  dotEl.style.left = pct + '%';
  dotEl.style.background = change > 0 ? 'var(--up)' : change < 0 ? 'var(--dn)' : 'var(--muted)';
}

function updateCard(sym, name, price, change, pct, o, h, l) {
  var pEl  = document.getElementById('p-'  + sym);
  var cEl  = document.getElementById('ch-' + sym);
  var nEl  = document.getElementById('n-'  + sym);
  var moEl = document.getElementById('mo-' + sym);
  var mhEl = document.getElementById('mh-' + sym);
  var mlEl = document.getElementById('ml-' + sym);
  var card = document.getElementById('c-'  + sym);
  if (!pEl) return;

  var old = prevPrices[sym];
  var priceChanged = (old === undefined || price !== old);

  if (priceChanged && old !== undefined && card) {
    card.classList.remove('fu','fd');
    void card.offsetWidth;
    card.classList.add(price > old ? 'fu' : 'fd');
  }
  prevPrices[sym] = price;

  if (nEl && name) nEl.textContent = name;
  pEl.className = 'price';
  pEl.textContent = price.toFixed(2);

  var sign = change >= 0 ? '+' : '';
  var cls  = change > 0 ? 'up' : change < 0 ? 'dn' : 'neu';
  cEl.className = 'change ' + cls;
  cEl.textContent = sign + change.toFixed(2) + '  (' + sign + pct.toFixed(2) + '%)';

  // 有新報價才推入歷史並重繪線圖
  if (priceChanged) {
    addHistory(sym, price);
    drawSparkline(sym, change);
  }
  updateDayRange(sym, price, l, h, change);

  if (moEl) moEl.textContent = fmtMeta(o);
  if (mhEl) mhEl.textContent = fmtMeta(h);
  if (mlEl) mlEl.textContent = fmtMeta(l);
}

function showError(sym, msg) {
  var pEl = document.getElementById('p-' + sym);
  var cEl = document.getElementById('ch-' + sym);
  if (pEl) { pEl.className = 'price'; pEl.textContent = '—'; }
  if (cEl) { cEl.className = 'change neu'; cEl.textContent = msg; }
}

function fmtMeta(v) {
  var n = parseFloat(v);
  return isNaN(n) ? '—' : n.toFixed(2);
}

function fetchJson(url, ms) {
  ms = ms || 12000;
  return new Promise(function(resolve, reject) {
    var done = false;
    var t = setTimeout(function() {
      if (!done) { done = true; reject(new Error('timeout')); }
    }, ms);
    fetch(url)
      .then(function(r) { return r.json(); })
      .then(function(d) { if (!done) { done = true; clearTimeout(t); resolve(d); } })
      .catch(function(e) { if (!done) { done = true; clearTimeout(t); reject(e); } });
  });
}

function fetchAll() {
  setStatus('loading', '更新中');
  var trading = isTradingHours();
  document.getElementById('modeBadge').textContent = trading ? '盤中即時' : '今日收盤';

  if (trading) {
    var ex_ch = tickers.map(function(s) { return 'tse_' + s + '.tw'; }).join('|');
    var url = MIS + '?ex_ch=' + encodeURIComponent(ex_ch) + '&json=1&delay=0&_=' + Date.now();
    // ↑ Safari 需停用跨來源限制：開發 > 停用跨來源限制
    fetchJson(url, 8000)
      .then(function(d) {
        var arr = d.msgArray || [];
        var map = {};
        arr.forEach(function(item) { map[item.c] = item; });
        var ok = 0;
        tickers.forEach(function(sym) {
          var item = map[sym];
          if (!item) { showError(sym, '查無資料'); return; }
          // item.z === '-' 代表本輪詢週期內無新成交，改用上次已知報價，避免退回昨收
          var price = item.z !== '-'
            ? parseFloat(item.z) || 0
            : (prevPrices[sym] !== undefined ? prevPrices[sym] : parseFloat(item.y) || 0);
          var prev  = parseFloat(item.y) || 0;
          var chg   = price - prev;
          var pct   = prev ? (chg / prev) * 100 : 0;
          updateCard(sym, item.n, price, chg, pct, item.o, item.h, item.l);
          ok++;
        });
        setStatus('live', '盤中  ' + ok + ' / ' + tickers.length);
        document.getElementById('lu').textContent = new Date().toLocaleTimeString('zh-TW', {hour12:false});
      })
      .catch(function(e) { setStatus('error', '失敗：' + e.message); });
  } else {
    var doFetch = closeCache
      ? Promise.resolve(closeCache)
      : fetchJson(OPENAPI, 12000)
          .then(function(arr) {
            if (!Array.isArray(arr)) throw new Error('格式錯誤');
            var map = {};
            arr.forEach(function(item) { map[item.Code] = item; });
            closeCache = map;
            return map;
          });
    doFetch.then(function(data) {
      var ok = 0;
      tickers.forEach(function(sym) {
        var d = data[sym];
        if (!d) { showError(sym, '查無資料'); return; }
        var price = parseFloat(d.ClosingPrice) || 0;
        var chg   = parseFloat(d.Change) || 0;
        var base  = price - chg;
        var pct   = base ? (chg / base) * 100 : 0;
        updateCard(sym, d.Name, price, chg, pct, d.OpeningPrice, d.HighestPrice, d.LowestPrice);
        ok++;
      });
      setStatus('closed', '收盤  ' + ok + ' / ' + tickers.length);
      document.getElementById('lu').textContent = new Date().toLocaleTimeString('zh-TW', {hour12:false});
    }).catch(function(e) { setStatus('error', '失敗：' + e.message); });
  }
}

function addTicker() {
  var v = document.getElementById('ti').value.trim();
  if (!v || tickers.indexOf(v) >= 0) { document.getElementById('ti').value = ''; return; }
  tickers.push(v);
  document.getElementById('ti').value = '';
  renderCards();
  fetchAll();
}
function removeTicker(sym) {
  tickers = tickers.filter(function(t) { return t !== sym; });
  delete prevPrices[sym];
  delete priceHistory[sym];
  renderCards();
  if (tickers.length > 0) fetchAll();
}
function changeInterval() {
  var ms = parseInt(document.getElementById('isel').value);
  clearInterval(timer);
  timer = setInterval(fetchAll, ms);
}
document.getElementById('ti').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') addTicker();
});

renderCards();
fetchAll();
timer = setInterval(fetchAll, 15000);
</script>
</body>
</html>
